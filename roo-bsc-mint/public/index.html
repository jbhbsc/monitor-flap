<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SquidToken</title>
    <meta name="description" content="SquidToken dividend claim page" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Cpath d='M13 42h38l-5 10H18l-5-10Z' fill='%23ffd36c'/%3E%3Cpath d='M18 40l7-18 7 13 8-23 7 28H18Z' fill='%23ffaf2e'/%3E%3Ccircle cx='25' cy='22' r='4' fill='%23fff2b8'/%3E%3Ccircle cx='40' cy='12' r='4' fill='%23fff2b8'/%3E%3C/svg%3E" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 50% 100%, rgba(139, 0, 0, 0.28), transparent 28%),
          radial-gradient(circle at 18% 14%, rgba(255, 215, 0, 0.08), transparent 24%),
          linear-gradient(180deg, #050505 0%, #080706 48%, #050505 100%);
        color: #f6ead1;
        font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -12vh -10vw;
        pointer-events: none;
      }

      body::before {
        background:
          radial-gradient(circle at 50% 112%, rgba(255, 214, 96, 0.14), transparent 18%),
          radial-gradient(circle at 50% 110%, rgba(139, 0, 0, 0.26), transparent 25%),
          repeating-radial-gradient(circle at 50% 116%, rgba(255, 200, 70, 0.1) 0 2px, transparent 2px 44px);
        filter: blur(10px);
        animation: magma 32s linear infinite;
      }

      body::after {
        background: linear-gradient(120deg, transparent 35%, rgba(255, 200, 70, 0.06) 50%, transparent 65%);
        filter: blur(16px);
        animation: embers 22s ease-in-out infinite alternate;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 26px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
        padding: 14px 18px;
        border: 1px solid rgba(255, 205, 92, 0.16);
        border-radius: 18px;
        background: rgba(5, 5, 5, 0.78);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
        font-weight: 900;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255, 214, 109, 0.38);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 215, 0, 0.16), rgba(139, 0, 0, 0.24));
        color: #ffe0a1;
        letter-spacing: 0.12em;
        box-shadow: 0 0 24px rgba(255, 190, 70, 0.2);
      }

      .wallet-button,
      .claim-button {
        border: 1px solid rgba(255, 215, 0, 0.32);
        border-radius: 999px;
        background: linear-gradient(180deg, #ffd700 0%, #ffaf2e 42%, #8b0000 100%);
        color: #fff;
        padding: 12px 18px;
        font-weight: 900;
        box-shadow: 0 0 22px rgba(255, 196, 67, 0.28), 0 0 30px rgba(139, 0, 0, 0.18);
      }

      .hero {
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
        gap: 26px;
        align-items: stretch;
        min-height: 430px;
        margin-bottom: 26px;
        padding: 34px;
        border: 1px solid rgba(255, 205, 92, 0.16);
        border-radius: 24px;
        background:
          radial-gradient(circle at 50% 84%, rgba(255, 190, 54, 0.1), transparent 16%),
          radial-gradient(circle at 50% 88%, rgba(139, 0, 0, 0.2), transparent 34%),
          rgba(10, 8, 7, 0.74);
        backdrop-filter: blur(18px);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(115deg, transparent 0 14px, rgba(255, 186, 62, 0.04) 14px 16px, transparent 16px 72px),
          radial-gradient(circle at 50% 70%, rgba(255, 211, 108, 0.1), transparent 24%);
        animation: magma 26s linear infinite;
      }

      .hero-copy,
      .claim-panel {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: inline-flex;
        gap: 8px;
        margin-bottom: 18px;
        padding: 7px 13px;
        border: 1px solid rgba(255, 205, 92, 0.2);
        border-radius: 999px;
        background: rgba(9, 8, 7, 0.72);
        color: #ffd36c;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0 0 16px;
        color: transparent;
        background: linear-gradient(180deg, #ffd700 0%, #ffbb2e 43%, #8b0000 100%);
        -webkit-background-clip: text;
        background-clip: text;
        font-size: clamp(40px, 5vw, 68px);
        line-height: 1;
        letter-spacing: 0.05em;
      }

      .lead {
        max-width: 640px;
        margin: 0;
        color: #cdb486;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        line-height: 1.6;
      }

      .stat-row {
        border: 1px solid rgba(255, 205, 92, 0.12);
        border-radius: 14px;
        background: rgba(15, 11, 9, 0.7);
        color: #e7d3a7;
        padding: 12px 14px;
      }

      .claim-panel {
        display: grid;
        align-content: center;
        gap: 14px;
        padding: 24px;
        border: 1px solid rgba(255, 205, 92, 0.14);
        border-radius: 18px;
        background: rgba(5, 5, 5, 0.52);
      }

      .claim-panel h2 {
        margin: 0;
        color: #ffd36c;
        font-size: 22px;
      }

      .claim-amount {
        display: grid;
        gap: 4px;
        padding: 18px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(255, 215, 0, 0.1), rgba(139, 0, 0, 0.16));
      }

      .claim-amount span {
        color: #a98a54;
        font-size: 13px;
      }

      .claim-amount strong {
        color: #fff;
        font-size: 30px;
      }

      .pool-amount {
        border: 1px solid rgba(255, 215, 0, 0.28);
        background:
          linear-gradient(180deg, rgba(255, 215, 0, 0.18), rgba(139, 0, 0, 0.22)),
          rgba(12, 8, 5, 0.9);
        box-shadow: 0 0 26px rgba(255, 192, 56, 0.18), inset 0 0 18px rgba(255, 215, 0, 0.08);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .panel {
        border: 1px solid rgba(255, 205, 92, 0.14);
        border-radius: 18px;
        background: rgba(8, 7, 6, 0.74);
        padding: 22px;
      }

      .panel h2 {
        margin: 0 0 14px;
        color: #ffd36c;
      }

      .stat-list {
        display: grid;
        gap: 10px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }

      .stat-row span {
        color: #a98a54;
      }

      .stat-row strong {
        color: #fff;
        text-align: right;
        word-break: break-all;
      }

      .value-action {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
      }

      .copy-button {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        border: 1px solid rgba(255, 215, 0, 0.28);
        border-radius: 8px;
        background: rgba(255, 215, 0, 0.08);
        color: #ffd36c;
        font-size: 15px;
        line-height: 1;
      }

      .copy-button:hover {
        background: rgba(255, 215, 0, 0.16);
      }

      .status {
        min-height: 20px;
        color: #e7d3a7;
        font-size: 13px;
      }

      .is-hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100% - 24px, 1180px);
        }

        .topbar,
        .hero,
        .grid {
          grid-template-columns: 1fr;
        }

        .hero {
          padding: 24px;
        }
      }

      @keyframes magma {
        from { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(1vw, -1vh, 0) scale(1.03); }
        to { transform: translate3d(0, 0, 0) scale(1); }
      }

      @keyframes embers {
        from { transform: translate3d(-1vw, 0, 0); }
        to { transform: translate3d(1vw, -1vh, 0); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="SquidToken">
          <span class="brand-mark">SQ</span>
          <span>
            <strong>SquidToken</strong><br />
            <small>The Combustion Dividend Token</small>
          </span>
        </a>
        <button id="connectButton" class="wallet-button" type="button">连接钱包</button>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow">SquidLaunch dividend pool</span>
            <h1>燃烧买入，王冠分红。</h1>
            <p class="lead">
              买入95% 进入生态钱包。分红按持币权重在页面领取。
            </p>
          </div>

          <section class="claim-panel" aria-label="Claim dividends">
            <h2>领取分红</h2>
            <div class="claim-amount pool-amount">
              <span>分红池总金额</span>
              <strong id="totalDividendsLabel">-- BNB</strong>
            </div>
            <div class="claim-amount">
              <span>当前可领取</span>
              <strong id="claimableAmount">-- BNB</strong>
            </div>
            <button id="claimButton" class="claim-button" type="button">领取 BNB 分红</button>
            <p id="statusText" class="status">连接钱包后读取你的分红。</p>
          </section>
        </section>

        <div class="grid">
          <section class="panel">
            <h2>代币信息</h2>
            <div class="stat-list">
              <div class="stat-row is-hidden" id="tokenNameRow"><span>名称</span><strong id="tokenNameLabel"></strong></div>
              <div class="stat-row is-hidden" id="tokenContractRow">
                <span>合约</span>
                <strong class="value-action">
                  <span id="tokenAddressLabel"></span>
                  <button id="copyTokenAddressButton" class="copy-button" type="button" title="复制合约地址" aria-label="复制合约地址">⧉</button>
                </strong>
              </div>
            </div>
          </section>

          <section class="panel">
            <h2>分红数据</h2>
            <div class="stat-list">
              <div class="stat-row"><span>我的余额</span><strong id="walletBalanceLabel">-- SQUID</strong></div>
              <div class="stat-row"><span>我的分红份额</span><strong id="dividendBalanceLabel">-- SQUID</strong></div>
              <div class="stat-row"><span>交易状态</span><strong id="tradingStatusLabel">--</strong></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="./vendor/ethers.umd.min.js"></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
